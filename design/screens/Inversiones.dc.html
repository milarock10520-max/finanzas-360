<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inversiones · Finanzas 360</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./f360.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="f360 screen {{themeClass}}" style="font-family: 'Manrope', system-ui, sans-serif; color: var(--text); background: var(--bg)">
<main class="scroll">

<header class="rise d1" style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<a href="Modulos.dc.html" class="icon-btn" aria-label="Volver">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<h1 class="display" style="margin: 0; font-size: 26px; font-weight: 700">Inversiones</h1>
</div>
<button class="icon-btn theme-btn" aria-label="{{themeLabel}}" onClick="{{toggle}}">
<svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
<svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</button>
</header>

<section class="hero rise d2" style="margin-top: 18px; padding: 22px; display: flex; flex-direction: column; gap: 18px">
<div class="orb" style="width: 240px; height: 240px; right: -90px; top: -100px; background: #7C3AED; opacity: .7"></div>
<div class="orb" style="width: 160px; height: 160px; left: -50px; bottom: -70px; background: #3355FF; opacity: .55; animation-duration: 17s"></div>
<div class="grid-lines"></div>
<div class="sheen"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: rgba(255,255,255,.72)">Patrimonio</span>
<span class="num" style="font-size: 34px; font-weight: 700; line-height: 1">$ 157.000.146</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div class="glass-pill" style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7)">Invertido</span>
<span class="num" style="font-size: 13px; font-weight: 700">$ 157,0 M</span>
</div>
<div class="glass-pill" style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7)">En balance</span>
<span class="num" style="font-size: 13px; font-weight: 700">$ 0</span>
</div>
<div class="glass-pill" style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7)">Utilidad</span>
<span class="num" style="font-size: 13px; font-weight: 700; color: #6EE7B7">+ $ 6</span>
</div>
</div>
</section>

<section class="card rise d3" style="margin-top: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 10px">
<span class="tile" style="width: 36px; height: 36px; border-radius: 12px; background: var(--violet-soft); color: var(--violet)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
Nueva inversión
</h2>
<label class="field"><span class="field-label">Nombre</span><input class="input" placeholder="Ej: CDT Bancolombia, Bitcoin"></label>
<label class="field"><span class="field-label">Monto</span><input class="input num" inputmode="numeric" placeholder="$ 0"></label>
<div class="field">
<span class="field-label">Tipo</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="5">
<button class="chip {{t.on}}" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}">{{t.label}}</button>
</sc-for>
</div>
</div>
<button class="btn btn-primary" style="background: var(--violet); color: #fff; box-shadow: 0 12px 28px -12px var(--violet)">Agregar al portafolio</button>
</section>

</main>

<nav class="nav" aria-label="Principal">
<a href="Main.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5L12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"></path></svg>Inicio</a>
<a href="Movimientos.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"></path></svg>Flujo</a>
<a href="Movimientos.dc.html" aria-label="Registrar movimiento"><span class="add"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></a>
<a href="Analisis.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"></path></svg>Análisis</a>
<a href="Metas.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4.5"></circle><circle cx="12" cy="12" r="1" fill="currentColor"></circle></svg>Metas</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { dark: null, type: 'CDT / Renta fija' };
  }
  renderVals() {
    const dark = this.state.dark !== null ? this.state.dark : !!this.props.dark;
    const types = ['CDT / Renta fija', 'Acciones', 'Cripto', 'Finca raíz', 'Negocio', 'Otro'];
    return {
      themeClass: dark ? 'dark' : '',
      themeLabel: dark ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro',
      toggle: () => this.setState({ dark: !dark }),
      types: types.map((t) => ({
        label: t,
        on: t === this.state.type ? 'on' : '',
        pressed: t === this.state.type ? 'true' : 'false',
        pick: () => this.setState({ type: t })
      }))
    };
  }
}
</script>
</body>
</html>
