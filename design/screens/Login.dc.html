<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Login · Finanzas 360</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./f360.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="f360 screen {{themeClass}}" style="font-family: 'Manrope', system-ui, sans-serif; color: var(--text); background: var(--bg); isolation: isolate">
<div class="orb" style="width: 320px; height: 320px; left: -120px; top: -80px; background: var(--primary); opacity: .22"></div>
<div class="orb" style="width: 260px; height: 260px; right: -110px; top: 300px; background: var(--cyan-bright); opacity: .18; animation-duration: 18s"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 32px 32px; opacity: .55; -webkit-mask-image: radial-gradient(70% 50% at 50% 38%, #000, transparent 75%); mask-image: radial-gradient(70% 50% at 50% 38%, #000, transparent 75%)"></div>

<div style="position: absolute; top: 24px; right: 20px">
<button class="icon-btn theme-btn" aria-label="{{themeLabel}}" onClick="{{toggle}}">
<svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
<svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</button>
</div>

<div style="height: 100%; padding: 0 28px 40px; display: flex; flex-direction: column; justify-content: flex-end; gap: 28px">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
<div class="rise d1" style="position: relative; width: 132px; height: 132px; display: grid; place-items: center; animation-name: rise">
<svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true" style="position: absolute; inset: 0; animation: spin 14s linear infinite">
<circle cx="66" cy="66" r="62" fill="none" stroke="var(--primary)" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 8" stroke-linecap="round"></circle>
<circle cx="66" cy="4" r="4" fill="var(--cyan-bright)"></circle>
</svg>
<svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true" style="position: absolute; inset: 0; animation: spin 9s linear infinite reverse">
<circle cx="66" cy="66" r="50" fill="none" stroke="var(--line)" stroke-width="1"></circle>
<circle cx="116" cy="66" r="3" fill="var(--primary)"></circle>
</svg>
<div style="width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); font-family: 'Sora', sans-serif; font-weight: 700; font-size: 34px; box-shadow: 0 18px 40px -12px var(--glow); animation: floaty 5s ease-in-out infinite">F</div>
</div>
<div class="rise d2" style="text-align: center; display: flex; flex-direction: column; gap: 10px">
<h1 class="display" style="margin: 0; font-size: 34px; font-weight: 700">Finanzas 360</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: var(--text-2)">Tu dinero, tus metas y tus hábitos.<br>Todo sincronizado en un solo lugar.</p>
</div>
<div class="rise d3" style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center">
<span class="chip" style="cursor: default"><span class="live"></span>Sincronización en la nube</span>
<span class="chip" style="cursor: default">Coach con IA</span>
</div>
</div>

<div class="rise d4" style="display: flex; flex-direction: column; gap: 14px">
<a href="Main.dc.html" class="btn btn-primary" style="width: 100%; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3M15 8l2 2"></path></svg>
Continuar con Google
</a>
<p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--text-3)">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
Tus datos se guardan cifrados y privados
</p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { dark: null };
  }
  renderVals() {
    const dark = this.state.dark !== null ? this.state.dark : !!this.props.dark;
    return {
      themeClass: dark ? 'dark' : '',
      themeLabel: dark ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro',
      toggle: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
