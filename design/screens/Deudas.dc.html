<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Deudas · Finanzas 360</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./f360.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="f360 screen {{themeClass}}" style="font-family: 'Manrope', system-ui, sans-serif; color: var(--text); background: var(--bg)">
<main class="scroll">

<header class="rise d1" style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<a href="Modulos.dc.html" class="icon-btn" aria-label="Volver">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<h1 class="display" style="margin: 0; font-size: 26px; font-weight: 700">Deudas</h1>
</div>
<div style="display: flex; gap: 8px">
<button class="icon-btn theme-btn" aria-label="{{themeLabel}}" onClick="{{toggle}}">
<svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
<svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</button>
<button class="icon-btn" aria-label="Nueva deuda" onClick="{{toggleForm}}" style="background: var(--primary); color: var(--on-primary); border-color: transparent">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="transition: transform .45s var(--spring); transform: {{plusRot}}"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</header>

<section class="card rise d2" style="margin-top: 18px; padding: 20px; display: flex; align-items: center; gap: 16px; overflow: hidden; position: relative">
<div style="position: relative; width: 84px; height: 84px; flex-shrink: 0">
<svg width="84" height="84" viewBox="0 0 108 108" role="img" aria-label="100% pagado">
<circle cx="54" cy="54" r="48" fill="none" stroke="var(--surface-2)" stroke-width="10"></circle>
<circle class="ring-arc" cx="54" cy="54" r="48" fill="none" stroke="var(--income)" stroke-width="10" stroke-linecap="round" stroke-dasharray="302" stroke-dashoffset="0" transform="rotate(-90 54 54)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: grid; place-items: center; color: var(--income)">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: rise .6s cubic-bezier(.34,1.56,.64,1) 1.4s both"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: var(--text-2)">Pendiente total</span>
<span class="num" style="font-size: 30px; font-weight: 700; line-height: 1">$ 0</span>
<span style="font-size: 13px; font-weight: 800; color: var(--income)">Libre de deudas</span>
</div>
</section>

<sc-if value="{{formOpen}}" hint-placeholder-val="{{ false }}">
<section class="card rise" style="margin-top: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 800">Nueva deuda</h2>
<label class="field"><span class="field-label">Nombre</span><input class="input" placeholder="Ej: Tarjeta de crédito"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label class="field"><span class="field-label">Monto total</span><input class="input num" inputmode="numeric" placeholder="$ 0"></label>
<label class="field"><span class="field-label">Cuotas</span><input class="input num" inputmode="numeric" placeholder="Opcional"></label>
</div>
<button class="btn btn-primary" onClick="{{toggleForm}}">Registrar deuda</button>
</section>
</sc-if>

<div class="rise d3" style="margin-top: 24px; display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">Historial</h2>
<span style="font-size: 13px; font-weight: 600; color: var(--text-3)">2 pagadas</span>
</div>

<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{debts}}" as="d" hint-placeholder-count="2">
<article class="card lift rise" style="padding: 16px; display: flex; flex-direction: column; gap: 12px; animation-delay: {{d.delay}}">
<div style="display: flex; align-items: center; gap: 12px">
<span class="tile" style="width: 40px; height: 40px; background: var(--income-soft); color: var(--income)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 10h18M7 15h3"></path></svg>
</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 800">{{d.name}}</span>
<span class="num" style="font-size: 13px; letter-spacing: 0; color: var(--text-3)">{{d.total}}</span>
</div>
<span style="padding: 6px 10px; border-radius: 10px; background: var(--income-soft); color: var(--income); font-size: 12px; font-weight: 800">Pagada</span>
</div>
<div class="bar"><i style="width: 100%; background: var(--income)"></i></div>
<div style="display: flex; justify-content: flex-end; gap: 4px">
<button class="icon-btn" aria-label="Editar {{d.name}}" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--text-3)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
</button>
<button class="icon-btn" aria-label="Eliminar {{d.name}}" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--text-3)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
</button>
</div>
</article>
</sc-for>
</div>

</main>

<nav class="nav" aria-label="Principal">
<a href="Main.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5L12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"></path></svg>Inicio</a>
<a href="Movimientos.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"></path></svg>Flujo</a>
<a href="Movimientos.dc.html" aria-label="Registrar movimiento"><span class="add"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></a>
<a href="Analisis.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"></path></svg>Análisis</a>
<a href="Metas.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4.5"></circle><circle cx="12" cy="12" r="1" fill="currentColor"></circle></svg>Metas</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { dark: null, form: false };
  }
  renderVals() {
    const dark = this.state.dark !== null ? this.state.dark : !!this.props.dark;
    const debts = [
      { name: 'Tarjeta Rappi', total: '$ 400.000 de $ 400.000' },
      { name: 'Colchón', total: '$ 2.039.000 de $ 2.039.000' }
    ];
    return {
      themeClass: dark ? 'dark' : '',
      themeLabel: dark ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro',
      toggle: () => this.setState({ dark: !dark }),
      formOpen: this.state.form,
      plusRot: this.state.form ? 'rotate(45deg)' : 'rotate(0)',
      toggleForm: () => this.setState({ form: !this.state.form }),
      debts: debts.map((d, i) => Object.assign({}, d, { delay: (0.25 + i * 0.08) + 's' }))
    };
  }
}
</script>
</body>
</html>
